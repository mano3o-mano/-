button.small{padding:8px 11px;min-height:40px}
button.primary{background:#7b4a28;color:#fff;border-color:#7b4a28}
button.ghost{background:transparent}
button.on{background:#ecd3a2;font-weight:700;border-color:#7b4a28}
button:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fffaf0;border:1px solid #dcc8a4;border-radius:12px;padding:12px 14px;margin:10px 0}
.card.alert{border-color:#b5543a;background:#fff1ea}
.card.changed{border:2px solid #3f7f5a}.card.locked{opacity:.75}
.tip{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:#fff6d6;border:1px solid #e1c56a;border-radius:12px;padding:10px 12px;margin:10px 0}
.tip>div{flex:1 1 auto;min-width:0}
.draft{display:inline}
.ga{display:inline-block;font-size:16px;font-weight:700;color:#8a5a12;background:#f8e3b4;border-radius:6px;padding:0 5px;margin-right:2px}
.say{background:#f8f0e0;border-left:4px solid #c9a46c;padding:8px 10px;border-radius:6px}
.qs{display:flex;flex-direction:column;gap:6px}.qs button{text-align:left}
.qa{margin:8px 0;padding:8px 10px;background:#f7efe0;border-radius:8px}.qa .q{font-weight:700}
.muted{color:#7a6a58}.good{color:#2f7048;font-weight:700}.bad{color:#a8402a;font-weight:700}.warnc{color:#9a5b00}
.new{color:#2f7048;font-weight:700}.doubt{color:#fff;background:#a8402a;border-radius:6px;padding:0 6px;font-size:16px}
.cross{color:#fff;background:#2f7048;border-radius:6px;padding:0 6px;font-size:16px}
.trap{color:#fff;background:#8a5a12;border-radius:6px;padding:0 6px;font-size:16px}
.big{font-size:19px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:16px;table-layout:auto}
th,td{border-bottom:1px solid #e6d7bb;padding:6px 4px;text-align:left;vertical-align:top}
th{color:#7a6a58;font-weight:600}
.slot{display:block;margin:8px 0}.slot select{display:block;width:100%;margin-top:4px}
select,input[type=text]{font:inherit;font-size:16px;padding:9px;border:1px solid #8b6e4c;border-radius:8px;background:#fff;max-width:100%}
input[type=text]{width:100%;margin:6px 0}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}.chk input{width:22px;height:22px}
.preview{background:#f4ead6;border-radius:10px;padding:10px;margin:10px 0}
.dish{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed #dcc8a4;padding:8px 0}
.dish>div{flex:1 1 180px;min-width:0}
.calc{font-size:16px;background:#e8eef7;border:1px dashed #6a83a8;border-radius:8px;padding:6px 8px;margin:6px 0}
.debug{border-color:#6a83a8;background:#f2f6fc}.debug summary{font-weight:700;cursor:pointer}
.opt{border-top:1px dashed #dcc8a4;padding-top:6px;margin-top:8px}

textarea{width:100%;height:140px;font-size:16px;font-family:ui-monospace,monospace;margin-top:8px}
.sticky-act{position:sticky;bottom:0;background:#f3ead8;padding:8px 0}
.tip>button{flex:0 0 auto;white-space:nowrap}

    infoChanges: changes, infoPerDay: changes / days, days,

    [U.mSecond, fmt(U.timesN, { n: m.secondBest }) + (again ? ' · ' + fmt(U.againIs, { v: again === 'yes' ? U.yes : U.no }) : ''), fmt(U.lineCore, { n: pa.secondBest }), again ? (m.secondBest >= pa.secondBest && again === 'yes') : null],
    [U.mSide, m.side.length ? m.side.map(s => fmt(U.sideItem, { d: s.day, dungeon: DUN[s.dungeon].name, st: s.changed ? U.stChanged : U.stNormal })).join(U.listSep) : U.none, U.recordOnly, null],
    [U.mResearch, fmt(U.researchSum, { a: m.research.A, b: m.research.B, r: m.research.rest, s: m.research.avgSec }), U.recordOnly, null],
    [U.mTension, fmt(U.tensionSum, { q: m.quitsAfterFail, t: ten || U.notYet }), U.recordOnly, null],
    [U.mEtc, fmt(U.etcSum, { min: m.avgDayMin, rej: m.rejects, w: m.wasted, money: m.money, fame: m.fame, seed: m.seed }), U.recordOnly, null]
  ].map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${mark(r[3])}</td></tr>`).join('');
  const json = JSON.stringify({ game: T.game, build: P.build, seed: S.seed, randomWorld: S.randomWorld, survey: S.survey, summary: m, log: S.log });
  const sv = (k, v, l) => btn('survey', l, `data-k="${k}" data-v="${v}"`, 'small' + (S.survey[k] === v ? ' on' : ''));
  return `<div class="card"><h2>${esc(U.resultTitle)}</h2><p>${esc(fmt(U.finalLine, { money: S.money, fame: S.fame }))}</p></div>
  <div class="card"><h3>${esc(U.surveyTitle)}</h3><p>${esc(U.surveyAgain)}</p><div class="row">${sv('again', 'yes', U.yes)}${sv('again', 'no', U.no)}</div>
  <p>${esc(fmt(U.surveyTension, { n: P.surveyScale }))}</p><div class="row">${Array.from({ length: P.surveyScale }, (_, i) => String(i + 1)).map(n => sv('tension', n, n)).join('')}</div></div>
  <div class="card"><h3>${esc(U.summaryTitle)}</h3><table><tr><th>${esc(U.thMetric)}</th><th>${esc(U.thValue)}</th><th>${esc(U.thLine)}</th><th></th></tr>${rows}</table></div>
  <div class="card"><h3>${esc(U.jsonTitle)}</h3><p class="muted">${esc(U.jsonHint)}</p>${btn('copy', U.copy, '', 'primary')} <span id="copymsg" class="good">${esc(ui.copyMsg)}</span>
  <textarea id="json" readonly>${esc(json)}</textarea></div>
  <div class="card">${btn('reset-open', U.playAgain)}</div>`;
}
async function copyJSON() {
  const ta = document.getElementById('json'); const txt = ta.value; let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); ok = true; } } catch (e) { }
  if (!ok) { try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) { } }
  ui.copyMsg = ok ? U.copied : U.copyFail; const m = document.getElementById('copymsg'); if (m) { m.textContent = ui.copyMsg; m.className = ok ? 'good' : 'bad'; }
  log('copyJSON', { ok });
}

function render() {
  document.title = fmt(U.pageTitle);
  const app = document.getElementById('app');
  app.innerHTML = band() + resetBox() + debugPanel() + nav() + main();
}

// ---- actions ----
function act(a, d) {
  const c = curCust();
  switch (a) {
    case 'nav': S.view = d.v; if (d.p) S.page = d.p; if (S.view === 'book') log('bookOpen', { page: S.page }); window.scrollTo(0, 0); break;
    case 'page': S.page = d.p; log('bookOpen', { page: d.p }); break;
    case 'tip': S.tips[d.k] = true; break;
    case 'reset-open': ui.reset = true; window.scrollTo(0, 0); break;
    case 'reset-cancel': ui.reset = false; break;
    case 'reset-go': { const el = document.getElementById('seedIn'); const seed = (el && el.value.trim()) || P.defaultSeed; ui.reset = false; clearSave(); newGame(seed, false); break; }
    case 'letter-read': case 'letter-skip': {
      const L = S.letters[S.phase === 'final' ? 'final' : S.day]; const sec = round((nowPlay() - S.letterAt) / 1000, 0);
      log(a === 'letter-read' ? 'letterRead' : 'letterSkipped', { n: L.items.length, sec });
      if (S.phase === 'final') { S.phase = 'result'; save(); } else { S.phase = 'market'; S.view = 'stall'; }
      window.scrollTo(0, 0); break;
    }
    case 'buy': { const i = ING[d.id]; if (S.money < i.price) break; S.money -= i.price; addInv({ id: i.id, day: S.day }); log('buy', { id: i.id, price: i.price }); break; }
    case 'buyb': { const t = TPL[d.t]; if (S.money < t.bundle) break; S.money -= t.bundle; addInv({ bundle: t.id, day: S.day }); log('buy', { id: t.id, price: t.bundle }); break; }
    case 'unbuy': { const it = invGet(Number(d.u)); if (!it || it.day !== S.day || S.phase !== 'market') break; S.money += it.bundle ? TPL[it.bundle].bundle : ING[it.id].price; removeInv(it.uid); log('unbuy', { id: it.bundle || it.id }); break; }
    case 'open-shop': S.phase = 'day'; S.view = 'stall'; draft = emptyDraft(); break;
    case 'ask': if (c && !c.done && !c.asked.includes(d.q) && c.asked.length < R.questionsAsked) { c.asked.push(d.q); log('questionAsked', { q: d.q }); c.talk.push({ q: d.q, text: answer(c, d.q) }); } break;
    case 'send-away': if (c && !c.done) { c.done = true; c.left = true; c.talk.push({ text: X.sendAway }); log('sendAway', {}); } break;
    case 'next-cust': if (c && c.done) { S.ci++; ui.kmsg = []; S.view = 'stall'; S.lastDraftKey = ''; window.scrollTo(0, 0); } break;
    case 'end-day': toEvening(); break;
    case 'to-night': toNight(); break;
    case 'tpl': draft = emptyDraft(d.t); draft.side = null; draftChanged(); break;
    case 'note': applyNote(Number(d.i)); break;
    case 'clear-draft': draft = emptyDraft(draft.tpl); break;
    case 'cook': cook(); break;
    case 'serve': serve(Number(d.u)); break;
    case 'doubt': S.codex[d.d].doubt = !S.codex[d.d].doubt; log('doubt', { dungeon: d.d, on: S.codex[d.d].doubt }); break;
    case 'rdoubt': S.raceDoubt[d.r] = !S.raceDoubt[d.r]; break;
    case 'research': doResearch(d.r); break;
    case 'next-day': endDay(); window.scrollTo(0, 0); break;
    case 'survey': S.survey[d.k] = d.v; log('survey', { q: d.k, v: d.v }); save(); break;
    case 'copy': copyJSON(); return;
    case 'dbg-skip': dbgSkip(); break;
    case 'dbg-money': S.money += P.debugMoney; log('debugMoney', { n: P.debugMoney }); break;
    case 'dbg-rand': clearSave(); newGame(S.seed, true); break;
    case 'dbg-default': clearSave(); newGame(S.seed, false); break;
  }
  render();
}
function dbgSkip() {
  if (S.phase === 'result') return;
  if (S.phase === 'final') { S.phase = 'result'; save(); return; }
  log('debugSkip', {});
  S.customers.forEach(c => c.done = true); S.ci = S.customers.length;
  if (S.finished.length) log('wasted', { n: S.finished.length, dishes: S.finished.map(x => x.name) });
  S.finished = []; endDay();
}
function onChange(e) {
  const el = e.target, k = el.dataset.c; if (!k) return;
  if (k === 'slot') { const i = Number(el.dataset.i); draft.slots[i] = el.value ? Number(el.value) : null; draft.order[i] = ++draft.seq; draftChanged(); }
  else if (k === 'roast') { draft.roast = el.checked; draftChanged(); }
  else if (k === 'side') { draft.side = el.value ? Number(el.value) : null; }
  else if (k === 'practice') { ui.practice = el.value; return; }
  render();
}

// ---- boot ----
function init() {
  storageOk = testStorage();
  const saved = load();
  if (saved) { S = saved; sessionStart = Date.now(); draft = emptyDraft(); consumeQuit(); log('resume', {}); }
  else newGame(P.defaultSeed, false);
  const app = document.getElementById('app');
  app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; act(b.dataset.a, b.dataset); });
  app.addEventListener('change', onChange);
  window.addEventListener('pagehide', markQuit);
  window.addEventListener('hashchange', render);
  render();
}
window.GAME = { judge, get S() { return S; }, actualReq, computeDraft, describe, newGame, metrics };
init();
</script>
